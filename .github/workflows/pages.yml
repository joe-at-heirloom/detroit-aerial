# Publish dist/ to GitHub Pages. The tiles are built locally by
# scripts/build_static.py (the runner has none of the 54 GB of mosaics) and
# committed; this only uploads what is in the repo.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ['dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
