<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detroit Air Survey</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#0B0F12; --panel:#141B20; --panel-hi:#1C262C;
  --rule:#24313A; --ink:#DCE6EB; --ink-dim:#7C8F9B; --ink-faint:#546570;
  --cyan:#35D6EE; --amber:#E0A94A;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;align-items:stretch;border-bottom:1px solid var(--rule);background:var(--panel);min-height:50px;flex:0 0 auto}
.brand{display:flex;flex-direction:column;justify-content:center;padding:6px 16px;border-right:1px solid var(--rule);min-width:190px}
.brand b{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin-top:2px}
.tabs{display:flex}
.tab{padding:0 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--rule)}
.tab:hover{background:var(--panel-hi)}
.tab em{font-style:normal;font-family:var(--mono);font-size:13px;font-weight:500}
.tab i{font-style:normal;font-size:9.5px;color:var(--ink-faint);letter-spacing:.05em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--panel-hi);box-shadow:inset 0 -2px 0 var(--amber)}
.spacer{flex:1}
.tools{display:flex;align-items:center;gap:14px;padding:0 16px;font-family:var(--mono);font-size:11px}
.rail{display:flex;border-bottom:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:11px;flex:0 0 auto;overflow-x:auto}
.side{display:flex;align-items:center;border-right:1px solid var(--rule)}
.lbl{padding:0 11px;color:var(--ink-faint);font-family:var(--sans);font-weight:600;font-size:9.5px;letter-spacing:.13em}
.chip{padding:6px 13px;color:var(--ink-dim)}
.chip:hover{background:var(--panel-hi);color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ground);font-weight:500}
.side.L .chip[aria-pressed="true"]{background:var(--amber)}
.side.R .chip[aria-pressed="true"]{background:var(--cyan)}
.op{display:flex;align-items:center;gap:6px}
.op input[type=range]{width:74px;accent-color:var(--cyan)}
.hint{padding:0 14px;color:var(--ink-faint);display:flex;align-items:center;white-space:nowrap}
#mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--ground)}
.leaflet-container{background:var(--ground)}
.leaflet-tile.nofade{opacity:1 !important;transition:none !important}
#swipe{position:absolute;top:0;bottom:0;width:2px;background:var(--amber);z-index:600;cursor:ew-resize}
#swipe::after{content:"\2194";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:28px;height:28px;border-radius:50%;background:var(--panel);border:1px solid var(--amber);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--amber)}
.tag{position:absolute;top:10px;z-index:601;font-family:var(--mono);font-size:12px;padding:3px 9px;
  background:rgba(11,15,18,.85);border:1px solid var(--rule)}
.note{position:absolute;left:14px;top:52px;max-width:330px;z-index:602;background:rgba(11,15,18,.93);
  border:1px solid var(--rule);padding:12px 14px;font-size:12px;line-height:1.5;color:var(--ink-dim)}
.note h3{margin:0 0 7px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);font-weight:600}
.note b{color:var(--ink);font-weight:600}
.marg{display:flex;border-top:1px solid var(--rule);background:var(--panel);font-family:var(--mono);font-size:11px;flex:0 0 auto}
.cell{padding:7px 15px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.cell .k{font-size:9px;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans)}
.cell .v{color:var(--ink)}
.cell.grow{flex:1;border-right:0}
.tools select{background:var(--panel-hi);color:var(--ink);border:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;padding:3px 6px;max-width:210px}
.tools select:hover{border-color:var(--amber)}
.pmark{cursor:pointer}
.pclus{background:var(--amber);color:var(--ground);border-radius:50%;font-family:var(--mono);
  font-size:12px;font-weight:600;text-align:center;line-height:22px;border:2px solid var(--ground);
  box-shadow:0 0 0 1px var(--amber);cursor:pointer}
.ptip.perm{background:rgba(11,15,18,.9);border-color:var(--amber);color:var(--ink)}
.ptip{background:var(--panel);border:1px solid var(--rule);color:var(--ink);font-family:var(--mono);
  font-size:11px;box-shadow:none;padding:3px 7px}
.ptip::before{border-top-color:var(--rule)}
#probe{position:absolute;right:14px;bottom:14px;z-index:603;background:rgba(11,15,18,.96);
  border:1px solid var(--rule);padding:9px 10px 10px;max-width:calc(100% - 28px);
  font-family:var(--mono);font-size:11px}
#probe[hidden]{display:none}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--ink-dim)}
.phead b{color:var(--amber);font-weight:600;font-family:var(--sans);font-size:12.5px}
.pspacer{flex:1}
.pz,.pclose{border:1px solid var(--rule);width:21px;height:21px;line-height:1;color:var(--ink-dim);flex:0 0 auto}
.pz:hover,.pclose:hover{background:var(--panel-hi);color:var(--ink)}
.pzl{color:var(--ink-faint);min-width:22px;text-align:center}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.pcell{display:flex;flex-direction:column;gap:4px}
.pcell i{font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);font-family:var(--sans)}
.pmap{width:148px;height:148px;background:var(--ground);border:1px solid var(--rule)}
.pmap.nocov{display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:10px}
.pblurb{margin-top:9px;max-width:700px;font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--ink-dim)}
.pblurb b{color:var(--ink)}
.psrc a{color:var(--cyan);text-decoration:none}
.psrc a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="brand"><b>Detroit Air Survey</b><span>DTE AERIAL &middot; LOCAL</span></div>
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <div class="tools">
      <label><input type="checkbox" id="streets"> STREET MAP</label>
      <label><input type="checkbox" id="roads"> CENTRELINES <span style="color:var(--ink-faint)">(z14+)</span></label>
      <label><input type="checkbox" id="places" checked> PLACES</label>
      <select id="placesel" title="researched places"><option value="">PLACES…</option></select>
      <label class="op">OPACITY <input type="range" id="opa" min="20" max="100" value="75"></label>
      <button id="fit">RESET</button>
    </div>
  </div>
  <div class="rail">
    <div class="side L" id="railL"><span class="lbl">LEFT</span></div>
    <div class="side R" id="railR"><span class="lbl">RIGHT</span></div>
    <div class="hint">drag the divider to wipe &middot; <b style="color:var(--amber);font-weight:500">click the map to see that spot in every year</b> &middot; native 0.63 m/px</div>
  </div>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="swipe"></div>
    <div class="tag" id="tagL"></div>
    <div class="tag" id="tagR"></div>
    <div class="note" id="note"></div>
    <div id="probe" hidden></div>
  </div>
  <div class="marg">
    <div class="cell"><span class="k">Comparing</span><span class="v" id="mCmp">&mdash;</span></div>
    <div class="cell"><span class="k">Cursor</span><span class="v" id="mPos">&mdash;</span></div>
    <div class="cell"><span class="k">Zoom</span><span class="v" id="mZoom">&mdash;</span></div>
    <div class="cell grow"><span class="k">Source</span><span class="v" id="mSrc">Wayne State University &middot; DTE Aerial Photo Collection</span></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let MAN, map, left, right, roadsLayer, streetLayer, split = 0.5, cur = null, L_ = 0, R_ = 1;
let curId = null, PLACES = [], placeLayer = null, probeMaps = [], probePt = null,
    probePlace = null, probeZoom = 17, probeToken = 0;

const NOTES = {
  downtown: ["Downtown &middot; 1949 / 1956 / 1961",
    "Three separate negatives, each georeferenced independently and warped onto one <b>0.60 m/px</b> grid &mdash; native resolution of the film.",
    "Wipe 1949 against 1961 to watch the <b>Hastings Street</b> corridor emptied for the Chrysler Freeway."],
  west: ["West Detroit &middot; 1949 / 1956 / 1961 / 1967",
    "Each block of negatives is solved as a photogrammetric block with <b>COLMAP</b> (a camera per negative, tied by thousands of matches along and across the flight lines), projected onto the block's own fitted ground surface, then placed on the map by one continuous warp.",
    "Every build is judged by how far two overlapping negatives disagree about the same ground, then by how far the whole block sits from modern imagery. <b>1961:</b> 2.0 / 2.0 m seams, 2.6 m absolute. <b>1967:</b> 2.0 / 4.0 m, 2.6 m. <b>1949:</b> 2.0 / 2.0 m seams, 4.1 m absolute; its placement is fitted straight to modern imagery, and an independent check against USGS orthophotos puts it at 4.4 to 5.3 m. <b>1956:</b> 2.0 / 4.0 m, 5.6 m absolute where 1961 covers the ground; its western column and northern 3 km have no earlier epoch to check against and are less certain."]
};

async function boot() {
  const hash = location.hash;          // show() clears it; read it first
  MAN = await (await fetch('/data/manifest.json?t=' + Date.now(), {cache: 'no-store'})).json();
  await loadPlaces();
  const tabs = document.getElementById('tabs');
  Object.entries(MAN.groups).forEach(([id, g], i) => {
    const b = document.createElement('button');
    b.className = 'tab'; b.dataset.g = id;
    b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    b.innerHTML = '<em>' + g.label + '</em><i>' + g.layers.length + ' layers</i>';
    b.onclick = () => { [...tabs.children].forEach(t => t.setAttribute('aria-selected', String(t === b))); show(id); };
    tabs.appendChild(b);
  });
  map = L.map('map', { zoomControl: true, attributionControl: false, maxZoom: 21,
                       zoomSnap: 0.25, fadeAnimation: false });
  map.on('mousemove', e => {
    document.getElementById('mPos').textContent =
      e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5);
  });
  map.on('zoomend move', () => {
    const z = map.getZoom();
    const mpp = 156543.03 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, z);
    document.getElementById('mZoom').textContent = 'z' + z.toFixed(2) + '  ' + mpp.toFixed(2) + ' m/px';
  });
  document.getElementById('fit').onclick = () => fit();
  document.getElementById('roads').onchange = e => {
    if (e.target.checked) { roadsLayer.addTo(map); } else { map.removeLayer(roadsLayer); }
  };
  roadsLayer = L.tileLayer('/t/__roads__/{z}/{x}/{y}.png',
    { maxZoom: 21, minZoom: 14, minNativeZoom: 14, opacity: .9, className: 'nofade' });
  // Esri's transparent transportation reference: modern roads + names, drawn for
  // draping over imagery rather than as a basemap.
  streetLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, maxNativeZoom: 19, opacity: .75, className: 'nofade' });
  const opa = document.getElementById('opa');
  opa.oninput = () => {
    const v = opa.value / 100;
    streetLayer.setOpacity(v);
    roadsLayer.setOpacity(Math.min(1, v + .15));
  };
  document.getElementById('streets').onchange = e => {
    if (e.target.checked) { streetLayer.addTo(map); streetLayer.bringToFront(); }
    else map.removeLayer(streetLayer);
  };
  document.getElementById('places').onchange = () => { drawPlaces(); };
  map.on('zoomend', renderPins);
  // Click anywhere to ask what was on that ground in every year we hold. This is
  // the question the wipe cannot answer: the wipe shows two years, and only along
  // the divider.
  map.on('click', e => openProbe(e.latlng, null));
  wireSwipe();
  show(Object.keys(MAN.groups)[0]);
  restoreFromHash(hash);
}


// -------------------------------------------------------------- places + probe
// Two related things. PLACES are researched pins: somewhere worth knowing about,
// with a note and its sources. The PROBE is the general case -- click any ground
// at all and see it in every year the survey covers, which is how you find out
// what used to be where a new building is.

async function loadPlaces() {
  try {
    const r = await fetch('/data/places.json?t=' + Date.now(), { cache: 'no-store' });
    PLACES = r.ok ? ((await r.json()).places || []) : [];
  } catch (e) { PLACES = []; }
}

function drawPlaces() {
  if (placeLayer) { map.removeLayer(placeLayer); placeLayer = null; }
  const on = document.getElementById('places').checked;
  const mine = PLACES.filter(p => (p.group || 'west') === curId);
  if (!on || !mine.length) return;
  placeLayer = L.layerGroup().addTo(map);
  renderPins();
}

// At the zoom that fits a whole block, pins a few hundred metres apart land within
// ten pixels of each other and read as one dot -- which is how three places looked
// like one. So group whatever overlaps on screen into a counted badge that zooms
// to its members, and name the pins outright once there is room.
function renderPins() {
  if (!placeLayer) return;
  placeLayer.clearLayers();
  const mine = PLACES.filter(p => (p.group || 'west') === curId);
  if (!mine.length) return;
  const z = map.getZoom();
  const pts = mine.map(p => ({ p: p, pt: map.latLngToLayerPoint([p.lat, p.lon]) }));
  const used = pts.map(() => false), groups = [];
  for (let i = 0; i < pts.length; i++) {
    if (used[i]) continue;
    const grp = [pts[i]]; used[i] = true;
    for (let j = i + 1; j < pts.length; j++) {
      if (!used[j] && pts[i].pt.distanceTo(pts[j].pt) < 38) { grp.push(pts[j]); used[j] = true; }
    }
    groups.push(grp);
  }
  groups.forEach(grp => {
    if (grp.length === 1) {
      const p = grp[0].p;
      const m = L.circleMarker([p.lat, p.lon], {
        radius: 7, weight: 2, color: '#E0A94A', fillColor: '#0B0F12', fillOpacity: .9,
        className: 'pmark'
      });
      m.on('click', ev => { L.DomEvent.stopPropagation(ev); openProbe(L.latLng(p.lat, p.lon), p); });
      if (z >= 14.5) m.bindTooltip(p.title, { permanent: true, direction: 'right',
                                              className: 'ptip perm', offset: [9, 0] });
      else m.bindTooltip(p.title, { direction: 'top', className: 'ptip', offset: [0, -7] });
      placeLayer.addLayer(m);
    } else {
      const lat = grp.reduce((a, x) => a + x.p.lat, 0) / grp.length;
      const lon = grp.reduce((a, x) => a + x.p.lon, 0) / grp.length;
      const m = L.marker([lat, lon], { icon: L.divIcon({
        className: 'pclus', html: String(grp.length), iconSize: [26, 26], iconAnchor: [13, 13] }) });
      m.bindTooltip(grp.map(x => x.p.title).join(' \u00b7 '), { direction: 'top', className: 'ptip' });
      m.on('click', ev => {
        L.DomEvent.stopPropagation(ev);
        map.fitBounds(L.latLngBounds(grp.map(x => [x.p.lat, x.p.lon])),
                     { padding: [70, 70], maxZoom: 17 });
      });
      placeLayer.addLayer(m);
    }
  });
}

function fillPlaceList() {
  const sel = document.getElementById('placesel');
  const mine = PLACES.filter(p => (p.group || 'west') === curId);
  sel.innerHTML = '<option value="">PLACES\u2026</option>' +
    mine.map(p => '<option value="' + p.id + '">' + p.title.replace(/</g, '&lt;') + '</option>').join('');
  sel.style.display = mine.length ? '' : 'none';
  const lab = document.querySelector('label[for-places], #places');
  if (lab && lab.parentElement) {
    lab.parentElement.lastChild.textContent = mine.length ? ' PLACES (' + mine.length + ')' : ' PLACES';
  }
  sel.onchange = () => {
    const p = mine.find(x => x.id === sel.value);
    sel.value = '';
    if (!p) return;
    const ll = L.latLng(p.lat, p.lon);
    map.setView(ll, Math.min(probeZoom, 18));
    openProbe(ll, p);
  };
}

function covers(lid, ll) {
  const l = MAN.layers.find(x => x.id === lid);
  if (!l || !l.bbox) return true;
  return ll.lat >= l.bbox[0] && ll.lat <= l.bbox[2] && ll.lng >= l.bbox[1] && ll.lng <= l.bbox[3];
}

// A block's bounding box is a rectangle; its actual film coverage is a ragged
// shape inside it, and 1956 in particular is missing whole corners. Rather than
// show a black square under a confident year label, read the alpha of the tile
// that holds the point: nodata is transparent, so this is exact.
function flown(lid, ll, z) {
  return new Promise(resolve => {
    const n = Math.pow(2, z);
    const fx = (ll.lng + 180) / 360 * n;
    const fy = (1 - Math.asinh(Math.tan(ll.lat * Math.PI / 180)) / Math.PI) / 2 * n;
    const x = Math.floor(fx), y = Math.floor(fy);
    const px = Math.min(255, Math.max(0, Math.floor((fx - x) * 256)));
    const py = Math.min(255, Math.max(0, Math.floor((fy - y) * 256)));
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = 256; c.height = 256;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(img, 0, 0);
        const x0 = Math.min(247, Math.max(0, px - 4)), y0 = Math.min(247, Math.max(0, py - 4));
        const d = g.getImageData(x0, y0, 9, 9).data;
        let a = 0;
        for (let i = 3; i < d.length; i += 4) a += d[i];
        resolve(a > 0);
      } catch (e) { resolve(true); }      // unreadable: assume flown
    };
    img.onerror = () => resolve(true);
    img.src = layerUrl(lid).replace('{z}', z).replace('{x}', x).replace('{y}', y);
  });
}

// A probe is worth linking to: #lat,lon,zoom reopens it on the same ground, so a
// spot someone wants to ask about can be sent as a URL.
function restoreFromHash(h) {
  const m = /^#(-?\d+\.?\d*),(-?\d+\.?\d*)(?:,(\d+))?$/.exec(h || '');
  if (!m) return;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  if (m[3]) probeZoom = Math.max(13, Math.min(20, parseInt(m[3], 10)));
  // the link may be for a scene other than the one that opens by default
  const gid = Object.keys(MAN.groups).find(g => {
    const b = MAN.groups[g].bbox;
    return b && lat >= b[0] && lat <= b[2] && lon >= b[1] && lon <= b[3];
  });
  if (gid && gid !== curId) {
    [...document.getElementById('tabs').children].forEach(t =>
      t.setAttribute('aria-selected', String(t.dataset.g === gid)));
    show(gid);
  }
  const ll = L.latLng(lat, lon);
  const near = PLACES.filter(p => (p.group || 'west') === curId)
    .find(p => Math.abs(p.lat - lat) < 3e-4 && Math.abs(p.lon - lon) < 3e-4);
  map.setView(ll, Math.min(probeZoom, 18));
  openProbe(ll, near || null);
}

function closeProbe() {
  history.replaceState(null, '', location.pathname);
  probeMaps.forEach(m => m.remove());
  probeMaps = []; probePt = null; probePlace = null;
  const box = document.getElementById('probe');
  if (box) { box.hidden = true; box.innerHTML = ''; }
}

function openProbe(ll, place) {
  probeMaps.forEach(m => m.remove());
  probeMaps = [];
  probePt = ll; probePlace = place || null;
  history.replaceState(null, '', '#' + ll.lat.toFixed(5) + ',' + ll.lng.toFixed(5) + ',' + probeZoom);
  const box = document.getElementById('probe');
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cells = cur.layers.map((lid, i) => {
    const l = MAN.layers.find(x => x.id === lid);
    return '<div class="pcell"><i>' + esc(l.label) + '</i><div class="pmap" id="pm' + i + '"></div></div>';
  }).join('');
  let blurb = '';
  if (place) {
    const src = (place.sources || []).map(s =>
      '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>').join(' &middot; ');
    blurb = '<div class="pblurb">' + place.blurb + (src ? '<div class="psrc" style="margin-top:5px">' + src + '</div>' : '') + '</div>';
  }
  box.innerHTML =
    '<div class="phead">' +
      '<span>' + ll.lat.toFixed(5) + ', ' + ll.lng.toFixed(5) + '</span>' +
      (place ? '<b>' + esc(place.title) + '</b>' : '') +
      '<span class="pspacer"></span>' +
      '<button class="pz" data-d="-1" title="zoom out">&minus;</button>' +
      '<span class="pzl">z' + probeZoom + '</span>' +
      '<button class="pz" data-d="1" title="zoom in">+</button>' +
      '<button class="pclose" title="close">&times;</button>' +
    '</div>' +
    '<div class="prow">' + cells + '</div>' + blurb;
  box.hidden = false;
  const token = ++probeToken, cellMaps = [];
  cur.layers.forEach((lid, i) => {
    const el = document.getElementById('pm' + i);
    if (!covers(lid, ll)) { el.classList.add('nocov'); el.textContent = 'not flown'; return; }
    flown(lid, ll, probeZoom).then(ok => {
      if (token !== probeToken || ok) return;
      const j = probeMaps.indexOf(cellMaps[i]);
      if (j >= 0) probeMaps.splice(j, 1);
      if (cellMaps[i]) cellMaps[i].remove();
      el.classList.add('nocov'); el.textContent = 'not flown';
    });
    const m = L.map(el, {
      zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
      doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false,
      fadeAnimation: false, maxZoom: 21
    }).setView(ll, probeZoom);
    L.tileLayer(layerUrl(lid), { maxZoom: 21, maxNativeZoom: 21, className: 'nofade' }).addTo(m);
    L.circleMarker(ll, { radius: 5, weight: 2, color: '#E0A94A', fill: false }).addTo(m);
    probeMaps.push(m); cellMaps[i] = m;
  });
  box.querySelectorAll('.pz').forEach(b => {
    b.onclick = () => {
      probeZoom = Math.max(13, Math.min(20, probeZoom + Number(b.dataset.d)));
      openProbe(probePt, probePlace);
    };
  });
  box.querySelector('.pclose').onclick = closeProbe;
}

function layerUrl(lid) {
  const L2 = MAN.layers.find(l => l.id === lid);
  const v = (L2 && L2.ver) ? ('?v=' + L2.ver) : '';
  return '/t/' + lid + '/{z}/{x}/{y}.png' + v;
}

function show(gid) {
  cur = MAN.groups[gid]; curId = gid;
  closeProbe();
  L_ = 0; R_ = cur.layers.length - 1;
  const n = NOTES[gid] || ['', ''];
  document.getElementById('note').innerHTML =
    '<h3>' + n[0] + '</h3>' + n.slice(1).map(p => '<p style="margin:6px 0 0">' + p + '</p>').join('');
  paint(); fit(); drawPlaces(); fillPlaceList();
}

function chips(el, sel, cb) {
  [...el.querySelectorAll('.chip')].forEach(c => c.remove());
  cur.layers.forEach((lid, i) => {
    const l = MAN.layers.find(x => x.id === lid);
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = l.label;
    b.setAttribute('aria-pressed', String(i === sel));
    b.onclick = () => cb(i);
    el.appendChild(b);
  });
}

function paint() {
  if (left) map.removeLayer(left);
  if (right) map.removeLayer(right);
  const lid = cur.layers[L_], rid = cur.layers[R_];
  left = L.tileLayer(layerUrl(lid), { maxZoom: 21, maxNativeZoom: 21, className: 'nofade' }).addTo(map);
  right = L.tileLayer(layerUrl(rid), { maxZoom: 21, maxNativeZoom: 21, className: 'nofade' }).addTo(map);
  const name = id => MAN.layers.find(x => x.id === id).label;
  document.getElementById('tagL').textContent = name(lid);
  document.getElementById('tagR').textContent = name(rid);
  document.getElementById('mCmp').textContent = name(lid) + ' → ' + name(rid);
  chips(document.getElementById('railL'), L_, i => { if (i === R_) R_ = L_; L_ = i; paint(); });
  chips(document.getElementById('railR'), R_, i => { if (i === L_) L_ = R_; R_ = i; paint(); });
  if (roadsLayer && document.getElementById('roads').checked) roadsLayer.bringToFront();
  if (streetLayer && document.getElementById('streets').checked) streetLayer.bringToFront();
  applyClip();
}

function applyClip() {
  const wrap = document.getElementById('mapwrap');
  const w = wrap.clientWidth;
  const x = w * split;
  // Leaflet translates layer containers as you pan, so a clip expressed in the
  // container's own coordinates drifts. Convert the viewport split into each
  // container's local frame every time.
  if (map && left && right && left.getContainer() && right.getContainer()) {
    const nw = map.containerPointToLayerPoint([0, 0]);
    const se = map.containerPointToLayerPoint(map.getSize());
    const clipX = nw.x + (se.x - nw.x) * split;
    left.getContainer().style.clip =
      'rect(' + [nw.y, clipX, se.y, nw.x].join('px,') + 'px)';
    right.getContainer().style.clip =
      'rect(' + [nw.y, se.x, se.y, clipX].join('px,') + 'px)';
    left.getContainer().style.clipPath = 'none';
    right.getContainer().style.clipPath = 'none';
  }
  const sw = document.getElementById('swipe');
  sw.style.left = x + 'px';
  document.getElementById('tagL').style.left = Math.max(8, x - 74) + 'px';
  document.getElementById('tagR').style.left = (x + 10) + 'px';
}

function wireSwipe() {
  const wrap = document.getElementById('mapwrap'), sw = document.getElementById('swipe');
  let drag = false;
  sw.addEventListener('pointerdown', e => { drag = true; sw.setPointerCapture(e.pointerId); e.preventDefault(); });
  wrap.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = wrap.getBoundingClientRect();
    split = Math.min(.99, Math.max(.01, (e.clientX - r.left) / r.width));
    applyClip();
  });
  const stop = e => { drag = false; try { sw.releasePointerCapture(e.pointerId); } catch (_) {} };
  wrap.addEventListener('pointerup', stop); wrap.addEventListener('pointercancel', stop);
  if (map) {
    ['move', 'zoom', 'zoomanim', 'moveend', 'zoomend', 'viewreset', 'load'].forEach(
      ev => map.on(ev, applyClip));
  }
  new ResizeObserver(applyClip).observe(wrap);
}

function fit() {
  const wrap = document.getElementById('mapwrap');
  if (!wrap.clientWidth || !wrap.clientHeight) { requestAnimationFrame(fit); return; }
  map.invalidateSize({ animate: false });
  const b = cur.bbox;
  map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: [12, 12], animate: false });
  setTimeout(applyClip, 60);
}

boot();
</script>
